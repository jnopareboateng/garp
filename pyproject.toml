[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garp"
version = "0.1.0"
description = "Embeddable agent harness"
requires-python = ">=3.12"
dependencies = [
    "agno[openai,os]==3.2.1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
garp = "garp.cli:main"
garp-api = "garp.api:main"
garp-worker = "garp.worker:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100
